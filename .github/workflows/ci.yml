name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The cheapest job in this file, and deliberately first: checkout plus one
  # stdlib-only python3 command, no compiler, no npm install, no network. It
  # verifies that every number README.md / BENCHMARKS.md / ENVIRONMENT.md
  # assert still equals what the source and the committed run artifacts say.
  #
  # It does NOT build, does NOT run CTest and does NOT fetch the OpenSSF
  # Scorecard. Coverage and the Scorecard live in docs/readme-facts.json,
  # refreshed on purpose by `tools/readme_facts.py --record`. A checker that
  # compiles becomes slow, then flaky, then disabled — and a disabled checker
  # is how the numbers drifted in the first place.
  readme-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify every documented number against the code
        run: python3 tools/readme_facts.py --check

      # Same idea, aimed at the web frontend. The landing page derives its
      # benchmark figures from web/src/features/performance/benchRuns.generated.ts,
      # which is written out of docs/benchmarks/runs/*.json. This proves the
      # generated file still matches those artifacts, so the page cannot go on
      # quoting a run the repository has moved off — which is exactly what it
      # did for months while every number on it was hand-typed.
      - name: Verify the landing page's numbers still match the run records
        run: python3 tools/gen_web_facts.py --check

      # Catches "Missing: X from lock file" before the frontend job spends two
      # minutes reaching the same conclusion. A macOS `npm install` can prune
      # top-level entries that only Linux needs — six pushes went red that way
      # on 2026-08-13 — and no local check sees it, because locally the tree
      # resolves. This walks every dependency edge in the lock instead.
      - name: Verify web/package-lock.json is self-consistent
        run: python3 tools/check_lockfile.py

      # The SIMD census records what is actually inside the shipped .wasm. Only
      # `--write` needs wabt; this check just proves the committed census still
      # describes the committed binary, so a rebuilt module cannot leave a stale
      # instruction count on the page.
      - name: Verify the wasm SIMD census still describes the shipped module
        run: python3 tools/wasm_census.py --check

      # The 299 misclassified digits the page can show. --write needs the
      # gitignored 831 MB data/ directory; --check only needs the committed pack
      # and its manifest, and proves the pack still matches the evaluation
      # record it illustrates.
      - name: Verify the misclassified-digit pack matches the evaluation record
        run: python3 tools/export_failures.py --check

      # The two evaluation studies each record the sha256 of every file they
      # consumed. Recording a digest is half a gate; this is the half that
      # compares it, so rebuilding the wasm cannot leave their conclusions
      # quietly describing a binary that no longer exists.
      - name: Verify the evaluation studies still describe their inputs
        run: python3 tools/check_eval_artifacts.py

  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFAST_MNIST_ENABLE_OPENMP=ON
          -DFAST_MNIST_ENABLE_NATIVE=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      # The self-hosted fonts are subset to the characters this site sets. A
      # missing glyph is a tofu box in production and nothing else in the build
      # notices, so the subset is checked against a character set derived from
      # web/src rather than trusted. This lives in the frontend job, not the
      # stdlib-only readme-facts job, because it needs fontTools.
      # `fonttools[woff2]` is not a real extra — pip accepts the unknown name,
      # installs plain fontTools, and the woff2 reader then dies on
      # "No module named brotli". The extra is spelled `woff`; brotli is named
      # explicitly here so the dependency is visible rather than implied.
      - name: Install fontTools
        run: pip install --quiet 'fonttools==4.63.0' 'brotli>=1.1.0'

      - name: Verify the font subset still covers every character the site sets
        working-directory: .
        run: python3 tools/subset_fonts.py --check

      # Everything above this line reports green when its subject is correct
      # AND when it has quietly stopped looking — the two are indistinguishable
      # in a log. This step breaks each gate's subject on purpose and requires
      # the gate to go red, then restores the file and verifies the restoration
      # by sha256. It found two gates that could not fail on its first run:
      # wasm_census never read the instruction counts it publishes, and
      # export_failures never read the digit count the landing page displays.
      #
      # It lives in this job rather than readme-facts because proving the font
      # gate needs fontTools, installed above. All seven are proven here; a gate
      # that cannot be proven is a failure, not a skip.
      - name: Prove every gate can actually fail
        working-directory: .
        run: python3 tools/check_gates.py
