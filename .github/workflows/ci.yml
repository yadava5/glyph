name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The cheapest job in this file, and deliberately first: checkout plus one
  # stdlib-only python3 command, no compiler, no npm install, no network. It
  # verifies that every number README.md / BENCHMARKS.md / ENVIRONMENT.md
  # assert still equals what the source and the committed run artifacts say.
  #
  # It does NOT build, does NOT run CTest and does NOT fetch the OpenSSF
  # Scorecard. Coverage and the Scorecard live in docs/readme-facts.json,
  # refreshed on purpose by `tools/readme_facts.py --record`. A checker that
  # compiles becomes slow, then flaky, then disabled — and a disabled checker
  # is how the numbers drifted in the first place.
  readme-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify every documented number against the code
        run: python3 tools/readme_facts.py --check

  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFAST_MNIST_ENABLE_OPENMP=ON
          -DFAST_MNIST_ENABLE_NATIVE=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run build

      - name: Lint
        run: npm run lint --if-present
