name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}

      # The two steps that can hang are budgeted here, at STEP level, and
      # deliberately not at job level. A job-level `timeout-minutes` ends the
      # run as `cancelled`, which is exactly what a supersede by a newer push
      # looks like — so the one case worth distinguishing (autobuild wedged on
      # cmake, analyze wedged extracting) would be indistinguishable from
      # routine churn in the checks list. A step-level timeout ends the run as
      # `failure`, which is reportable, notifies, and blocks a merge.
      #
      # 45 minutes is a hang budget, not a performance target: the cpp matrix
      # leg normally finishes well inside it, so this only fires on a wedge.
      - name: Autobuild (C/C++)
        if: matrix.language == 'cpp'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        timeout-minutes: 45

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        timeout-minutes: 45
        with:
          category: "/language:${{ matrix.language }}"
